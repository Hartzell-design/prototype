<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northbridge Plan Insights</title>
    <meta name="description" content="Prototype: a plan-sponsor participant engagement dashboard rebuilt on the Northbridge 2026 design system. Northbridge is fictional; all data is sample data." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23123F37'/%3E%3Cpath d='M7 23V18a9 9 0 0 1 18 0v5' fill='none' stroke='%23C9A977' stroke-width='3'/%3E%3Cpath d='M16 6v6' stroke='%23F3EEE2' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap" />
    <script>
      // Apply the saved or requested theme before first paint so there's no flash.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var t = q || localStorage.getItem("nb-theme");
          if (t === "legacy") document.documentElement.setAttribute("data-theme", "legacy");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
